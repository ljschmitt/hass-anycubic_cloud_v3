name: "Lint and Build"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-token-macos:
    runs-on: macos-latest
    name: "Test: macOS token instructions"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test documented token commands
        run: python -m unittest discover -s tests -p test_slicer_token_commands.py -v
  lint-python:
    runs-on: ubuntu-latest
    name: "Lint: Python"
    steps:
      - name: Check out source repository
        uses: actions/checkout@v3
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Check synchronized version files
        run: python scripts/sync_version.py --check
      - name: Check for private local data
        run: python scripts/check_private_data.py
      - name: flake8 Lint
        uses: py-actions/flake8@v2
        with:
          path: "custom_components"
      - name: Run unit tests
        run: |
          python -m pip install cryptography
          python -m unittest discover -s tests
      - name: Run mypy
        uses: jpetrucciani/mypy-check@master
        with:
          path: './custom_components'
          mypy_flags: '--config-file=mypy.ini'
          requirements_file: requirements.txt
          python_version: "3.14"
      - name: Run mypy
        uses: isort/isort-action@v1
        with:
          configuration: "--settings-path=pyproject.toml"
      - name: Check translation diff
        run: |
          python custom_components/anycubic_ha_integration/scripts/build_translations.py
          git diff --exit-code
  lint-ts:
    runs-on: ubuntu-latest
    name: "Lint & Build: Typescript"
    steps:
      - name: Check out source repository
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache-dependency-path: custom_components/anycubic_ha_integration/frontend_panel/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: custom_components/anycubic_ha_integration/frontend_panel
      - name: Run lint
        run: npm run lint
        working-directory: custom_components/anycubic_ha_integration/frontend_panel
      - name: Test panel and card print-time formatting
        run: node tests/test_print_time_frontend.cjs
      - name: Build and check diff
        run: |
          npm run build && npm run build_card
          git diff --exit-code
        working-directory: custom_components/anycubic_ha_integration/frontend_panel
